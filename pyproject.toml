[project]
name = "jev"
version = "0.1.0"
description = "Experiments probing TypeSafe AI's Jev model"
readme = "README.md"
authors = [
    { name = "Josh Hornsby", email = "jdhornsby@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "datasets>=5.0.1",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.6.0",
]

[project.scripts]
jev-plays-chess = "jev.chess.play:main"
jev-knows = "jev.knowledge.probe:main"
jev-routes = "jev.routing.probe:main"
jev-complies = "jev.compliance.probe:main"
jev-judges = "jev.judge.run:main"
jev-tokenizer = "jev.tokenizer.fingerprint:main"

[dependency-groups]
# Reference tokenizers for `jev-tokenizer`. Heavy, so kept out of the default install:
#   uv sync --group fingerprint
fingerprint = [
    "tiktoken>=0.7",
    "transformers>=4.44",
    "sentencepiece>=0.2",  # SentencePiece models: Llama-2, Mistral, Gemma
    "protobuf>=4",  # DeBERTa-v3 SentencePiece conversion
    "matplotlib>=3.8",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
